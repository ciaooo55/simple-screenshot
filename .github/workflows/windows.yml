name: Windows build and package

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build Release
        run: |
          dotnet build src/App/SimpleScreenshot.csproj -c Release -p:EnableWindowsTargeting=true
          dotnet build src/Ocr/SimpleScreenshot.Ocr.csproj -c Release -p:RestoreLockedMode=true -p:EnableWindowsTargeting=true
      - name: Run unit tests
        run: dotnet test tests-dotnet/SimpleScreenshot.Tests.csproj -c Release
      - name: Assemble portable ZIP
        run: ./scripts/package.ps1
      - name: Check packaged OCR client and worker
        shell: powershell
        timeout-minutes: 3
        run: ./scripts/check-ocr.ps1 -PackageDir dist/staging
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SimpleScreenshot-win-x64
          path: dist/SimpleScreenshot-win-x64.zip
          if-no-files-found: error
